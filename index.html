<title>Личное приглашение</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#3e4938;color:#4f4939;font-family:system-ui,-apple-system,sans-serif}body{min-height:100svh}#gate{min-height:100svh;display:grid;place-items:center;padding:28px 20px;background:radial-gradient(ellipse at 15% 5%,#68705245,transparent 55%),radial-gradient(ellipse at 90% 95%,#263528bb,transparent 60%)}.paper{max-width:440px;width:100%;position:relative;padding:43px 30px 38px;text-align:center;background:#f2e6cd;border:1px solid #cfbb95;border-radius:3px;box-shadow:0 12px 35px #16231942;transform:rotate(-.7deg)}.paper::before{content:"";position:absolute;top:-13px;left:calc(50% - 45px);height:26px;width:90px;background:repeating-linear-gradient(90deg,#d2b98988 0 2px,#e7d4afaa 2px 4px);transform:rotate(4deg)}.icon{font-size:42px;color:#9b673b;margin-bottom:15px}.paper h1{font-family:Georgia,serif;font-size:29px;line-height:1.25;font-weight:500;margin:0 0 18px}.paper p{font-size:15px;line-height:1.8;margin:0}.paper small{display:block;font-size:12px;line-height:1.7;margin-top:22px;color:#8d7855}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#3e4938}iframe[hidden],#gate[hidden]{display:none}noscript p{padding:20px;text-align:center;color:#eee1c5}@media(max-width:360px){.paper{padding:36px 23px 30px}.paper h1{font-size:26px}.paper p{font-size:14px}}
</style>
<script src="unlock.js" defer></script>
</head>
<body>
<main id="gate"><section class="paper" aria-labelledby="gate-title"><div class="icon" aria-hidden="true">♡</div><h1 id="gate-title">Личное приглашение</h1><p id="status" role="status" aria-live="polite">Это приглашение открывается по секретной ссылке.</p><small id="hint">Попроси отправить тебе полную ссылку ♡</small></section></main>
<noscript><p>Чтобы открыть приглашение, включи JavaScript в браузере.</p></noscript>
</body>
</html>
